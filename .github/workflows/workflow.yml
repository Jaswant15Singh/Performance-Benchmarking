name: Desertation workflow
on:
  push:
    branches: [dev, main]

env:
  AWS_REGION: us-east-2
  ECS_CLUSTER: desertation-backend
  ECS_SERVICE: desertation-backend-service
  ECS_TASK_FAMILY: desertation-backend
  LAMBDA_FUNCTION: your-lambda-function-name

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: workflow start
      uses: actions/checkout@v4

    - name: installing node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build ECS image
      working-directory: ./backend
      run: |
        docker build -f Dockerfile \
          -t ${{ steps.ecr-login.outputs.registry }}/desertation-ecs:latest .

    - name: Push ECS image
      run: docker push ${{ steps.ecr-login.outputs.registry }}/desertation-ecs:latest

    - name: Register new ECS task definition (EC2)
      working-directory: ./backend
      run: |
        sed -i "s|PLACEHOLDER_IMAGE|${{ steps.ecr-login.outputs.registry }}/desertation-ecs:latest|" ecs-task-def.json
        aws ecs register-task-definition --cli-input-json file://ecs-task-def.json

    - name: Deploy to ECS
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --task-definition ${{ env.ECS_TASK_FAMILY }} \
          --force-new-deployment

    - name: Build Lambda image
      working-directory: ./backend
      run: |
        docker build -f Dockerfile.lambda \
          -t ${{ steps.ecr-login.outputs.registry }}/desertation-lambda:latest .

    - name: Push Lambda image
      run: docker push ${{ steps.ecr-login.outputs.registry }}/desertation-lambda:latest


